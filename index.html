<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Расчёт ремонта</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --app-bg: var(--tg-theme-bg-color, #f4f5f7);
      --app-text: var(--tg-theme-text-color, #17212b);
      --app-hint: var(--tg-theme-hint-color, #77828c);
      --app-card: var(--tg-theme-secondary-bg-color, #fff);
      --app-accent: var(--tg-theme-button-color, #3390ec);
      --app-accent-text: var(--tg-theme-button-text-color, #fff);
      --app-border: color-mix(in srgb, var(--app-text) 12%, transparent);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--app-bg); color: var(--app-text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 540px; margin: 0 auto; padding: 24px 16px 100px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .intro { margin: 0 0 20px; color: var(--app-hint); font-size: 14px; }
    .card { padding: 16px; margin: 12px 0; border: 1px solid var(--app-border); border-radius: 16px; background: var(--app-card); }
    .title { display: block; margin-bottom: 12px; font-weight: 700; font-size: 15px; }
    .opt { display: flex; align-items: center; gap: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--app-border); border-radius: 12px; cursor: pointer; }
    .opt:has(input:checked) { border-color: var(--app-accent); background: color-mix(in srgb, var(--app-accent) 10%, var(--app-card)); }
    .hint { display: block; color: var(--app-hint); font-size: 13px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .val { color: var(--app-accent); font-size: 22px; font-weight: 700; }
    input[type="range"] { width: 100%; accent-color: var(--app-accent); }
    .input { width: 100%; padding: 12px; border: 1px solid var(--app-border); border-radius: 12px; background: var(--app-bg); color: var(--app-text); font: inherit; }
    .total { display: flex; justify-content: space-between; align-items: center; padding: 18px; border-radius: 16px; background: color-mix(in srgb, var(--app-accent) 14%, var(--app-card)); font-weight: 700; }
    .sum { font-size: 24px; }
    .btn { width: 100%; padding: 14px; margin-top: 14px; border: 0; border-radius: 14px; background: var(--app-accent); color: var(--app-accent-text); font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Расчёт стоимости ремонта</h1>
    <p class="intro">Выберите параметры и оставьте контакт для связи.</p>
    <div class="card">
      <span class="title">Тип ремонта</span>
      <label class="opt"><input type="radio" name="type" value="Косметический" data-rate="8000" checked><div><b>Косметический</b><span class="hint">от 8 000 ₽ / м²</span></div></label>
      <label class="opt"><input type="radio" name="type" value="Капитальный" data-rate="18000"><div><b>Капитальный</b><span class="hint">от 18 000 ₽ / м²</span></div></label>
      <label class="opt"><input type="radio" name="type" value="Дизайнерский" data-rate="30000"><div><b>Дизайнерский</b><span class="hint">от 30 000 ₽ / м²</span></div></label>
    </div>
    <div class="card">
      <div class="row"><span class="title" style="margin:0">Площадь</span><span class="val" id="areaTxt">60 м²</span></div>
      <input id="area" type="range" min="20" max="200" value="60">
    </div>
    <div class="card">
      <span class="title">Дополнительно</span>
      <label class="opt"><input type="checkbox" name="srv" value="Дизайн-проект" data-price="50000"><div><b>Дизайн-проект</b><span class="hint">+50 000 ₽</span></div></label>
      <label class="opt"><input type="checkbox" name="srv" value="Вывоз мусора" data-price="15000"><div><b>Вывоз строительного мусора</b><span class="hint">+15 000 ₽</span></div></label>
    </div>
    <div class="card">
      <span class="title">Ваш телефон или @username</span>
      <input class="input" id="contact" type="text" placeholder="+7 900 123-45-67 или @username">
    </div>
    <div class="total"><span>Итого примерно:</span><span class="sum" id="sumTxt">480 000 ₽</span></div>
    <button class="btn" id="sendBtn" type="button">Отправить расчет</button>
  </main>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyOBVPv-3lEjlwvXfeWrGg1KXOJAYhM3ZecvYj6XC9GwjlupJ2rpyFGotef_Yo4hvpW/exec';

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const area = document.getElementById('area');
    const contact = document.getElementById('contact');
    const sendBtn = document.getElementById('sendBtn');
    let total = 480000;

    if (tg?.initDataUnsafe?.user?.username) {
      contact.value = '@' + tg.initDataUnsafe.user.username;
    }

    function calc() {
      const rate = Number(document.querySelector('input[name="type"]:checked').dataset.rate);
      const sq = Number(area.value);
      document.getElementById('areaTxt').textContent = sq + ' м²';
      let add = 0;
      document.querySelectorAll('input[name="srv"]:checked').forEach(el => add += Number(el.dataset.price));
      total = sq * rate + add;
      const formatted = total.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('sumTxt').textContent = formatted;
      if (tg?.MainButton) {
        tg.MainButton.setText('Отправить расчет • ' + formatted);
        tg.MainButton.show();
      }
    }

    document.querySelectorAll('input').forEach(el => el.addEventListener('input', calc));

    async function send() {
      if (!contact.value.trim()) {
        alert('Укажите телефон или @username!');
        return;
      }
      const type = document.querySelector('input[name="type"]:checked').value;
      const srvs = Array.from(document.querySelectorAll('input[name="srv"]:checked')).map(el => el.value).join(', ') || 'Нет';
      const u = tg?.initDataUnsafe?.user;
      const who = u ? `${u.first_name || ''} (@${u.username || u.id})` : 'Гость';

      sendBtn.disabled = true;
      sendBtn.textContent = 'Отправляем...';
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            who: who,
            contact: contact.value,
            type: type,
            area: area.value,
            srvs: srvs,
            sum: total.toLocaleString('ru-RU') + ' ₽'
          })
        });
        if (tg) { tg.showAlert('Заявка успешно отправлена!', () => tg.close()); }
        else { alert('Заявка успешно отправлена!'); }
      } catch (e) {
        alert('Ошибка сети: ' + e.message);
      }
      sendBtn.disabled = false;
      sendBtn.textContent = 'Отправить расчет';
    }

    sendBtn.addEventListener('click', send);
    if (tg?.MainButton) tg.MainButton.onClick(send);
    calc();
  </script>
</body>
</html>
